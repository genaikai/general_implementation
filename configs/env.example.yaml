# 설정 예시. sync.sh 가 {AA}/configs/env.yaml 로 없을 때만 복사한다 (규격 §2.2).
#
# 운영 실값은 {AA}/configs/env.yaml 에만 있고 저장소에는 오지 않는다 (C3).
# .gitignore 가 configs/*.yaml 을 통째로 막고 이 파일만 예외로 둔다.
#
# CLI 인자만 쓰는 프로젝트라면 configs/ 를 통째로 지워도 된다. sync.sh 는
# 이 파일이 없으면 설정 단계를 건너뛴다.

paths:
  # 이 파이썬으로 갈아타서 실행한다. activate 불필요 (규격 §3.1).
  # 비워두면 지금 켜져 있는 파이썬으로 그냥 돈다.
  venv:
